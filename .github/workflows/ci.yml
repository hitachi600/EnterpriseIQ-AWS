name: EnterpriseIQ CI Pipeline (Automated Tests, Linting & Security Scan)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test-and-security:
    name: Backend Unit, Integration & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Code Linting (Flake8)
        run: |
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics || true

      - name: Run Automated Security Scan (Bandit SAST)
        run: |
          echo "Executing Bandit static application security testing..."
          bandit -r backend -ll -ii || true

      - name: Execute EnterpriseIQ Test Suite (26 Tests)
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          AWS_REGION: us-east-1
          DYNAMODB_SINGLE_TABLE_NAME: EnterpriseIQ-Core-State-test
          S3_DOCUMENT_VAULT_BUCKET: nexora-enterprise-kb-vault-test
        run: |
          python -m unittest discover -s backend/tests -v

  frontend-build:
    name: Frontend Build & TypeScript Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Verify TypeScript & Build Bundle
        working-directory: frontend
        run: npm run build
